# Бэкенд-сервис: отвечает своим именем контейнера и полученным X-Request-Id.
events {}
http {
    access_log off;
    server {
        listen 8080;
        location /auth {                     # сервис аутентификации: пускает только токен good
            if ($http_authorization = "Bearer good") { return 204; }
            return 401;
        }
        location / { return 200 "$hostname req=$http_x_request_id user=$http_x_user\n"; }
    }
}
