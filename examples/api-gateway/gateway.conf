# Шлюз: маршрутизация по пути, проверка токена во внешнем сервисе, лимит, идентификатор запроса.
events {}
http {
    access_log off;
    limit_req_zone $http_authorization zone=perclient:1m rate=5r/s;

    upstream users { server users:8080; }          # имя разрешается один раз, при старте nginx

    server {
        listen 8080;
        resolver 127.0.0.11 valid=1s ipv6=off;    # DNS Docker; нужен для переменной ниже

        location = /_auth {
            internal;
            proxy_pass http://auth:8080/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /orders/ {                        # имя в переменной — разрешается заново по TTL
            auth_request /_auth;
            limit_req zone=perclient burst=2 nodelay;
            limit_req_status 429;
            set $orders http://orders:8080;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User anna;
            proxy_pass $orders;
        }
        location /plain/ {                         # тот же сервис без проверки — для сравнения задержки
            proxy_pass http://users;
        }
        location /users/ {
            auth_request /_auth;
            proxy_set_header X-Request-Id $request_id;
            proxy_pass http://users;
        }
    }
}
