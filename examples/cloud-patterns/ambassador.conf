# Сайдкар-посол: живёт в сетевом пространстве приложения, слушает localhost:9000.
# Повторяет запрос при 503 и ошибке соединения, ставит тайм-аут — приложение об этом не знает.
events {}
http {
    access_log off;
    upstream rates {
        server rates:8080 max_fails=0;
        server rates:8080 max_fails=0;      # тот же адрес ещё раз: nginx повторяет только на «следующем» сервере
        server rates:8080 max_fails=0;
    }
    server {
        listen 9000;
        location / {
            proxy_pass http://rates;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 200ms;
            proxy_read_timeout 1s;
        }
    }
}
