# Нестабильный внешний сервис курсов: примерно 30% ответов — 503.
events {}
http {
    access_log off;
    split_clients "${request_id}" $fail { 30% 1; * 0; }
    server {
        listen 8080;
        location / {
            if ($fail) { return 503; }
            return 200 "EUR 1.08\n";
        }
    }
}
