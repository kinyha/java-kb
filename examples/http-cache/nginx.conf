# Общий кеш (как CDN или reverse proxy) перед origin на хосте.
events {}
http {
    proxy_cache_path /tmp/cache keys_zone=edge:10m inactive=10m;
    server {
        listen 8080;
        proxy_cache edge;
        add_header X-Cache $upstream_cache_status always;

        location / {
            proxy_pass http://host.docker.internal:8090;
            proxy_cache_revalidate on;            # Истёкшее — проверить у origin по ETag (If-None-Match, 304).
        }
        location /rates {
            proxy_pass http://host.docker.internal:8090;
            proxy_cache_background_update on;     # stale-while-revalidate: отдать старое, обновить в фоне.
            proxy_cache_use_stale updating;
        }
    }
}
