# Алерты для SLO 99.9% успешных запросов за 30 дней: бюджет ошибок 0.1%.
groups:
  - name: payments-slo
    rules:
      # Наивный порог: доля ошибок за 5 минут выше 1%.
      - alert: ErrorRateAbove1Percent
        expr: sum by (job) (rate(requests_total{code="500"}[5m])) / sum by (job) (rate(requests_total[5m])) > 0.01
        for: 1m
        labels: { severity: page }
      # Быстрое сжигание: за час съедено 2% месячного бюджета (скорость 14.4), и ещё горит сейчас (5 минут).
      - alert: ErrorBudgetFastBurn
        expr: |
          (sum by (job) (rate(requests_total{code="500"}[1h])) / sum by (job) (rate(requests_total[1h])) > 14.4 * 0.001)
          and
          (sum by (job) (rate(requests_total{code="500"}[5m])) / sum by (job) (rate(requests_total[5m])) > 14.4 * 0.001)
        labels: { severity: page }
      # Медленное сжигание: за 6 часов съедено 5% бюджета (скорость 6), и продолжается (30 минут).
      - alert: ErrorBudgetSlowBurn
        expr: |
          (sum by (job) (rate(requests_total{code="500"}[6h])) / sum by (job) (rate(requests_total[6h])) > 6 * 0.001)
          and
          (sum by (job) (rate(requests_total{code="500"}[30m])) / sum by (job) (rate(requests_total[30m])) > 6 * 0.001)
        labels: { severity: page }
      # Тикет: бюджет тратится быстрее нормы весь последний день.
      - alert: ErrorBudgetTicket
        expr: |
          (sum by (job) (rate(requests_total{code="500"}[1d])) / sum by (job) (rate(requests_total[1d])) > 1 * 0.001)
          and
          (sum by (job) (rate(requests_total{code="500"}[2h])) / sum by (job) (rate(requests_total[2h])) > 1 * 0.001)
        labels: { severity: ticket }
