# Kafka 4.3 в режиме KRaft, как в проде: три контроллера (кворум метаданных) и три брокера.
# Брокеры с хоста: localhost:19092, localhost:29092, localhost:39092.
x-common: &common
  CLUSTER_ID: kb-kafka-cluster-0001
  KAFKA_CONTROLLER_QUORUM_VOTERS: 101@controller-1:9093,102@controller-2:9093,103@controller-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-controller: &controller
  image: apache/kafka:4.3.0

x-broker: &broker
  image: apache/kafka:4.3.0
  depends_on: [controller-1, controller-2, controller-3]

services:
  controller-1:
    <<: *controller
    hostname: controller-1
    environment: { <<: *common, KAFKA_NODE_ID: 101, KAFKA_PROCESS_ROLES: controller, KAFKA_LISTENERS: "CONTROLLER://:9093" }
  controller-2:
    <<: *controller
    hostname: controller-2
    environment: { <<: *common, KAFKA_NODE_ID: 102, KAFKA_PROCESS_ROLES: controller, KAFKA_LISTENERS: "CONTROLLER://:9093" }
  controller-3:
    <<: *controller
    hostname: controller-3
    environment: { <<: *common, KAFKA_NODE_ID: 103, KAFKA_PROCESS_ROLES: controller, KAFKA_LISTENERS: "CONTROLLER://:9093" }
  kafka-1:
    <<: *broker
    hostname: kafka-1
    ports: ["19092:19092"]
    environment:
      <<: *common
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
  kafka-2:
    <<: *broker
    hostname: kafka-2
    ports: ["29092:29092"]
    environment:
      <<: *common
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
  kafka-3:
    <<: *broker
    hostname: kafka-3
    ports: ["39092:39092"]
    environment:
      <<: *common
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
