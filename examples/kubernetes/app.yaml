apiVersion: v1
kind: ConfigMap
metadata: { name: payments-config }
data:
  GREETING: "hello-v1"
  greeting: "hello-v1"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments }
spec:
  replicas: 3
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: app
          image: kb-k8s-app:1
          imagePullPolicy: Never              # образ загружен в узел вручную
          ports: [{ containerPort: 8080 }]
          env:
            - { name: VERSION, value: "1" }
            - name: GREETING                 # переменная окружения из ConfigMap — читается при старте
              valueFrom: { configMapKeyRef: { name: payments-config, key: GREETING } }
          volumeMounts:
            - { name: config, mountPath: /config }   # файл из ConfigMap — обновляется в работающем поде
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 2
      volumes:
        - name: config
          configMap: { name: payments-config, items: [{ key: greeting, path: greeting }] }
---
apiVersion: v1
kind: Service
metadata: { name: payments }
spec:
  selector: { app: payments }                 # трафик получают поды с этой меткой
  ports: [{ port: 80, targetPort: 8080 }]
