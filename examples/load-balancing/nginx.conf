# Три бэкенда на хосте; один медленный. Разные порты — разные стратегии.
events {}
http {
    access_log off;
    upstream rr {                       # round robin — по умолчанию
        server backend:8091;
        server backend:8092;
        server backend:8093;
    }
    upstream lc {
        least_conn;                     # к серверу с меньшим числом активных соединений
        server backend:8091;
        server backend:8092;
        server backend:8093;
    }
    upstream crash {                    # 8094 падает посреди запроса; 8091 — запасной
        server backend:8094 max_fails=0;   # не помечать упавшим, чтобы каждый запрос шёл сюда первым
        server backend:8091 backup;
    }
    server { listen 8081; location / { proxy_pass http://rr; } }
    server { listen 8082; location / { proxy_pass http://lc; } }
    server {
        listen 8083;
        location / {
            proxy_pass http://crash;
            proxy_next_upstream error timeout;   # значение по умолчанию; POST после отправки не повторяется
        }
    }
    server {
        listen 8084;
        location / {
            proxy_pass http://crash;
            proxy_next_upstream error timeout non_idempotent;   # повторять и POST — опасно
        }
    }
}
