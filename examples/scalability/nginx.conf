# Два экземпляра одного сервиса за round robin: :8086 — сессии в памяти, :8087 — сессии в Redis.
events {}
http {
    access_log off;
    upstream memory { server backend:8191; server backend:8192; }
    upstream redis  { server backend:8193; server backend:8194; }
    server { listen 8086; location / { proxy_pass http://memory; } }
    server { listen 8087; location / { proxy_pass http://redis; } }
}
